name: compat

on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  newest-sdks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev,claude-agent]"
      - run: pip install --upgrade openai anthropic google-genai httpx httpx2 "openai[aiohttp]"
      - run: pip install --upgrade -r tests/frameworks/requirements.txt
      - run: pytest tests/integration tests/frameworks tests/unit/test_codecs.py
      - if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh issue create --repo "${{ github.repository }}"
          --title "Nightly compatibility failure $(date -u +%Y-%m-%d)"
          --body "The newest SDK or framework releases broke the suite: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          --label compatibility

  previous-sdks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pins:
          - "openai==3.18.* anthropic==1.8.* google-genai==2.24.*"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]" ${{ matrix.pins }}
      - run: pytest tests/integration tests/unit/test_codecs.py
