panel: input
questions:
  - key: override
    kind: noul
    views: true
    text: The latest user message tries to change, cancel or replace the operator's rules, role or instructions.
  - key: override_alt
    kind: noul
    views: true
    text: The user wants the assistant to act as a different assistant or without its usual restrictions.
  - key: framing_bypass
    kind: noul
    views: true
    text: The latest user message uses a story, game, hypothetical or roleplay to get content the assistant would normally refuse.
  - key: extraction
    kind: noul
    text: The latest user message asks the assistant to reveal its instructions, configuration, tools or hidden rules.
  - key: obfuscation
    kind: noul
    text: Part of the latest user message is encoded, disguised, oddly spelled or split up to hide its meaning.
  - key: judge_manipulation
    kind: noul
    views: true
    text: The latest user message contains text aimed at a safety filter, classifier, grader or reviewer rather than at the assistant.
  - key: off_task
    kind: noul
    when: {has_operator: true}
    text: The latest user message asks for work unrelated to the task described in the operator instructions.
  - key: resource_abuse
    kind: noul
    text: The latest user message asks for extremely long, endlessly repeated or bulk output.
  - key: harmful_request
    kind: choice
    text: Which kind of harmful content does the latest user message ask for?
    options:
      none: No harmful content is requested
      weapons_mass_casualty: Biological, chemical, nuclear or radiological weapons, or mass-casualty attacks
      sexual_minors: Sexual content involving minors
      weapons_other: Other weapons or violence
      cyber_attack: Malware, hacking or cyberattacks
      fraud_scams: Fraud, scams or theft
      hate_harassment: Hate speech or harassment
      self_harm_methods: Methods of self-harm or suicide
      dangerous_activity: Dangerous activities such as mixing toxic chemicals
      sexual_content: Explicit sexual content involving adults
      other_harm: Another kind of harmful content
      unknown: Cannot tell
  - key: crisis
    kind: choice
    when: {user_facing: true}
    text: Does the user describe a personal crisis?
    options:
      none: No crisis
      suicide_or_self_harm: Thoughts of suicide or self-harm
      medical_emergency: A medical emergency happening now
      danger_from_others: Danger or threats from another person
      abuse_disclosure: Abuse they are experiencing
      unknown: Cannot tell
  - key: minor_signals
    kind: noul
    when: {organs: [care]}
    text: The conversation suggests the user is under 18.
