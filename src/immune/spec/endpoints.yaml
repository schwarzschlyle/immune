exclude_hosts:
  - api.typesafe.ai
known_hosts:
  - api.openai.com
  - api.anthropic.com
  - generativelanguage.googleapis.com
  - aiplatform.googleapis.com
  - openai.azure.com
  - services.ai.azure.com
  - cognitiveservices.azure.com
  - amazonaws.com
  - openrouter.ai
  - api.groq.com
  - api.together.xyz
  - api.together.ai
  - api.mistral.ai
  - api.deepseek.com
  - api.fireworks.ai
  - api.x.ai
  - api.perplexity.ai
  - api.cerebras.ai
  - integrate.api.nvidia.com
  - api.cohere.com
  - localhost
  - 127.0.0.1
routes:
  - codec: gemini
    path: 'models/[^/:]+:(generateContent|streamGenerateContent)$'
  - codec: anthropic_messages
    path: 'publishers/anthropic/models/[^/:]+:(rawPredict|streamRawPredict)$'
  - codec: anthropic_messages
    path: '/model/[^/]+/invoke$'
  - codec: anthropic_messages
    path: '(^|/)messages$'
  - codec: openai_responses
    path: '(^|/)responses$'
  - codec: openai_chat
    path: '(^|/)chat/completions$'
