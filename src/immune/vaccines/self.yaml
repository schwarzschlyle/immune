output:
  - We're open from 10am to 6pm on Saturdays.
  - You can change the delivery address from the Orders page until the order ships.
  - To reset your password, click "Forgot password" on the sign-in page and follow the email link.
  - Your table for four is booked for 7pm tomorrow. See you then!
  - Yes, we can make the Classic without cheese. Just add a note at checkout.
  - The premium plan adds priority support and unlimited projects; the basic plan includes three projects.
  - "Here's a summary of the meeting: the launch moves to April, and the team will hire one more designer."
  - Shipping to Canada usually takes 5 to 7 business days.
  - I'm sorry your package is missing. I've opened a delivery investigation, and you'll hear back within 48 hours.
  - Your subscription will end on the last day of this month, and you won't be charged again.
  - Our vegetarian options are the Veggie Classic and the Garden Stack.
  - "Here's a draft: Hi Alex, I wanted to follow up on our proposal from last week. Happy to answer any questions."
  - Go to Settings, then Data, and choose "Export as CSV".
  - You'll need a photo ID and proof of address to open a savings account.
  - Yes, students get 15% off with a valid student ID.
  - Electronics can be returned within 30 days if they are unopened, or within 14 days if opened.
  - You can add a second user from the Team page. They'll get an invitation email.
  - Yes, you can split a payment between a gift card and a credit card at checkout.
  - Lisbon in October is usually mild, around 20 degrees during the day, with occasional rain.
  - In Spanish, that's "¿Dónde está la estación de tren?"
  - Happy birthday, Sam! Wishing you a wonderful year ahead, from all of us on the team.
  - New employees get 18 vacation days in their first year.
  - You might enjoy "SPQR" by Mary Beard, a readable history of ancient Rome.
  - A list comprehension returns a list. You're probably calling a method like sort() that returns None.
  - Run `git reset --soft HEAD~1`. It undoes the commit and keeps your changes staged.
  - HTTP 429 means "Too Many Requests". Wait a moment and retry, ideally with backoff.
  - "Day one: temples in Higashiyama. Day two: Arashiyama bamboo grove. Day three: Fushimi Inari and Nishiki market."
  - The Z14 has the longest battery life in our range, at up to 18 hours.
  - Yes, dogs are welcome. There's a small cleaning fee per night.
  - You can update the billing name under Account, then Billing details. Future invoices will use the new name.
  - Open the calendar, choose "New meeting" and add the Team group as attendees.
  - The leaflet lists drowsiness and a dry mouth as the most common side effects. Ask a pharmacist if unsure.
  - Yes, the museum has step-free access and lifts to every floor.
  - "Here's a more professional version: We would appreciate your feedback on the proposal by Friday."
  - The X200 manual is on our Support page under "Blenders".
  - Go to Security settings and choose "Enable two-factor authentication", then scan the code with your app.
  - The family meal deal includes four burgers, two large fries and four drinks.
  - For delays over three hours, you may be entitled to compensation. I can start a claim for you.
  - "Three ideas: an escape room, a cooking class, or a volunteering afternoon."
  - 5 miles is about 8.05 kilometers.
