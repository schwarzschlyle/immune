# Everyday traffic ("self") for vaccine trials. A trial runs a vaccine over these samples, at the vaccine's stage,
# to estimate how often it would fire on ordinary use. Add your own traffic with `immune vaccines trial --corpus`.
# Keep every sample ordinary: no attacks, no secrets, no personal data.
