name: showcase

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      live:
        description: "Also run the live demo (uses OpenAI and Jev credits)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: immune config validate immune.yaml
      - run: immune vaccines test
      - run: immune vaccines trial bobs.no_competitor_mentions --corpus data/replies.jsonl --max-rate 0.01
      - run: pytest
      - run: python -m showcase --offline demo

  live:
    if: github.event_name == 'workflow_dispatch' && inputs.live
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      DEMO_MAX_CALLS: "80"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python -m showcase demo
